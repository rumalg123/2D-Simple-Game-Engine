name: Validate Windows pull requests

# The main-branch release workflow is intentionally independent.
# A pull request should compile and test without publishing release assets.
on:
  pull_request:
    branches:
      - main

# New commits supersede earlier candidate builds on the same pull request.
# The main-branch release workflow remains serialized and never canceled.
concurrency:
  group: simpleengine-pr-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  windows:
    name: Windows x64 build and CTest
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - name: Check out candidate source
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Install MSYS2 UCRT64 toolchain and GLFW
        uses: msys2/setup-msys2@v2
        with:
          msystem: UCRT64
          update: true
          install: >-
            mingw-w64-ucrt-x86_64-gcc
            mingw-w64-ucrt-x86_64-cmake
            mingw-w64-ucrt-x86_64-ninja
            mingw-w64-ucrt-x86_64-binutils
            mingw-w64-ucrt-x86_64-glfw
            mingw-w64-ucrt-x86_64-lua54

      - name: Configure and compile every executable
        shell: msys2 {0}
        run: |
          set -euo pipefail
          cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release
          cmake --build build --parallel 2
          for target in engine engine_tests runtime_boundary_tests project_manager_tests simpleengine_project player_scene_tests tilemap_animation_tests terrain_clip_tests asset_workspace_tests asset_import_tests SimpleEngineEditor SimpleEnginePlayer snake_sample flappy_bird_sample basic_game_template; do
            test -f "build/${target}.exe" || { echo "Missing target: ${target}.exe"; exit 1; }
          done

      - name: Bundle runtime DLLs for smoke testing
        shell: msys2 {0}
        run: |
          set -euo pipefail
          declare -A visited=()
          copy_runtime_deps() {
            local binary="$1"
            while IFS= read -r dll; do
              local dependency="/ucrt64/bin/${dll}"
              if [[ ! -f "${dependency}" || -n "${visited[${dll}]+x}" ]]; then
                continue
              fi
              visited["${dll}"]=1
              cp -f "${dependency}" build/
              copy_runtime_deps "${dependency}"
            done < <(objdump -p "${binary}" | awk '/DLL Name:/ { print $3 }')
          }
          for target in engine engine_tests runtime_boundary_tests project_manager_tests simpleengine_project player_scene_tests tilemap_animation_tests terrain_clip_tests asset_workspace_tests asset_import_tests SimpleEngineEditor SimpleEnginePlayer snake_sample flappy_bird_sample basic_game_template; do
            copy_runtime_deps "build/${target}.exe"
          done

      - name: Verify the player does not contain editor symbols
        shell: msys2 {0}
        run: |
          set -euo pipefail
          if nm -C build/SimpleEnginePlayer.exe | grep -E 'ImGui::|ImGui_Impl'; then
            echo "SimpleEnginePlayer must not link Dear ImGui."
            exit 1
          fi

      - name: Run all tests, including packaging smoke test
        shell: msys2 {0}
        run: |
          set -euo pipefail
          ctest --test-dir build --output-on-failure
